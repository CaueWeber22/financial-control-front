<main class="workspace-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Ir para o resumo">
      <img class="brand-mark" src="cointrol-icon.png" alt="" width="40" height="40" />
      <span class="brand-name">coin<em>trol</em></span>
    </a>

    <div class="profile-block">
      <span>Sessão de</span>
      <strong>{{ session.profile()?.first_name || 'Usuário' }} {{ session.profile()?.last_name || '' }}</strong>
      <small>{{ session.profile()?.email }}</small>
    </div>

    <nav class="sidebar-nav" aria-label="Áreas financeiras">
      @for (item of navigation; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <span>Ambiente seguro</span>
      <button class="ghost-button" type="button" [disabled]="session.loading()" (click)="logout()">Encerrar sessão</button>
    </div>
  </aside>

  <section class="main-area">
    <header class="topbar">
      <div class="topbar-copy">
        <p>{{ todayLabel }}</p>
        <strong>Seu dinheiro, com contexto.</strong>
      </div>
      <div class="topbar-actions">
        <button
          class="theme-toggle"
          type="button"
          [attr.aria-pressed]="theme.isDark()"
          [attr.aria-label]="theme.isDark() ? 'Ativar modo claro' : 'Ativar modo escuro'"
          (click)="theme.toggle()"
        >
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
          </span>
          <span>{{ theme.isDark() ? 'Claro' : 'Escuro' }}</span>
        </button>
        <app-health-pill [status]="session.apiStatus()" />
      </div>
    </header>

    <section class="content">
      <router-outlet />
    </section>
  </section>

  <app-toast [message]="session.message()" [error]="session.error()" />
</main>
