<article class="panel split-panel">
  <div>
    <div class="section-heading">
      <p class="eyebrow">Contas</p>
      <h2>Nova conta</h2>
    </div>

    <form [formGroup]="accountForm" (ngSubmit)="createAccount()" class="form-grid">
      <label>
        Nome
        <input formControlName="name" placeholder="Conta principal" />
      </label>
      <label>
        Tipo
        <select formControlName="type">
          <option value="CHECKING">Corrente</option>
          <option value="SAVINGS">Poupança</option>
          <option value="CASH">Dinheiro</option>
          <option value="INVESTMENT">Investimento</option>
        </select>
      </label>
      <label>
        Moeda
        <input formControlName="currency" maxlength="3" />
      </label>
      <label>
        Saldo inicial
        <input type="number" min="0" step="0.01" formControlName="openingBalance" />
      </label>
      <button class="primary-button" type="submit">Salvar conta</button>
    </form>
  </div>

  <div class="data-list">
    @for (account of store.accounts(); track account.id) {
      <button class="data-row clickable" type="button" (click)="loadBalance(account.id)">
        <span>{{ account.name }}</span>
        <strong>{{ account.currency }}</strong>
        <small>{{ account.type }} · {{ account.status }}</small>
      </button>
    } @empty {
      <p class="empty-state">Nenhuma conta ativa. Cadastre a primeira para organizar seus movimentos.</p>
    }
  </div>
</article>
