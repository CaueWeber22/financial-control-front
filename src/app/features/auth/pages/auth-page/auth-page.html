<main class="access-page">
  <header class="access-header">
    <div class="brand">
      <img class="brand-mark" src="cointrol-icon.png" alt="" width="40" height="40" />
      <span class="brand-name">coin<em>trol</em></span>
    </div>

    <app-health-pill [status]="session.apiStatus()" />
  </header>

  <section class="access-stage" [class.registration-open]="showRegistration()" aria-label="Acesso ao Cointrol">
    @if (!showRegistration()) {
      <article class="access-form-panel">
        <header class="access-form-heading">
          <h1 #formHeading tabindex="-1">Acesse sua conta</h1>
          <p>Entre para acompanhar seu dinheiro.</p>
        </header>

        <form [formGroup]="loginForm" (ngSubmit)="login()" class="form-grid">
          <label>
            E-mail
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="seu@email.com"
            />
          </label>

          <label>
            Senha
            <input
              type="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Sua senha"
            />
          </label>

          <button class="primary-button" type="submit" [disabled]="session.loading()">
            {{ session.loading() ? 'Entrando…' : 'Entrar' }}
          </button>
        </form>
      </article>

      <aside class="access-invite" aria-labelledby="invite-heading">
        <div class="access-invite-copy">
          <h2 id="invite-heading">Ainda não tem uma conta?</h2>
          <p>Crie seu acesso gratuitamente.</p>
          <button class="access-create-button" type="button" [disabled]="session.loading()" (click)="openRegistration()">
            Criar minha conta
          </button>
        </div>
        <p class="access-invite-footer">Contas claras. Decisões tranquilas.</p>
      </aside>
    } @else {
      <article class="access-form-panel access-registration">
        <button class="access-back" type="button" [disabled]="session.loading()" (click)="backToLogin()">
          <span aria-hidden="true">←</span> Voltar para entrar
        </button>
        <header class="access-form-heading">
          <h1 #formHeading tabindex="-1">Crie sua conta</h1>
          <p>Preencha seus dados para começar.</p>
        </header>

        <form [formGroup]="registerForm" (ngSubmit)="register()" class="form-grid two-columns">
          <label>
            Nome
            <input formControlName="first_name" autocomplete="given-name" placeholder="Seu nome" />
          </label>

          <label>
            Sobrenome
            <input formControlName="last_name" autocomplete="family-name" placeholder="Seu sobrenome" />
          </label>

          <label>
            E-mail
            <input type="email" formControlName="email" autocomplete="email" placeholder="seu@email.com" />
          </label>

          <label>
            Telefone (opcional)
            <input type="tel" formControlName="phone" autocomplete="tel" placeholder="+55 11 99999-9999" />
          </label>

          <label>
            Gênero
            <select formControlName="gender">
              <option value="" disabled>Selecione</option>
              <option value="female">Feminino</option>
              <option value="male">Masculino</option>
              <option value="other">Outro</option>
            </select>
          </label>

          <label>
            Nascimento
            <input type="date" formControlName="date_of_birth" autocomplete="bday" />
          </label>

          <label class="full-line">
            Senha
            <input type="password" formControlName="password" autocomplete="new-password" placeholder="Crie uma senha" />
          </label>

          <button class="primary-button full-line" type="submit" [disabled]="session.loading()">
            {{ session.loading() ? 'Criando conta…' : 'Criar minha conta' }}
          </button>
        </form>
      </article>
    }
  </section>

  <footer class="access-footer">Seu controle financeiro começa aqui.</footer>

  <app-toast [message]="session.message()" [error]="session.error()" />
</main>
